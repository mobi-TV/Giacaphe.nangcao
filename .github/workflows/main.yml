                  return "${cal.get(Calendar.YEAR)}-${cal.get(Calendar.DAY_OF_YEAR)}-${cal.get(Calendar.HOUR_OF_DAY)}-$dayOffset"
              }

              fun compute(dayOffset: Int = 0): CalendarDayInfo {
                  val tz = TimeZone.getTimeZone("Asia/Ho_Chi_Minh")
                  val cal = Calendar.getInstance(tz)
                  if (dayOffset != 0) {
                      cal.add(Calendar.DAY_OF_YEAR, dayOffset)
                  }

                  val dd = cal.get(Calendar.DAY_OF_MONTH)
                  val mm = cal.get(Calendar.MONTH) + 1
                  val yy = cal.get(Calendar.YEAR)
                  val hour = cal.get(Calendar.HOUR_OF_DAY)
                  val week = cal.get(Calendar.WEEK_OF_YEAR)

                  val dowStr = when (cal.get(Calendar.DAY_OF_WEEK)) {
                      Calendar.MONDAY -> "THỨ HAI"
                      Calendar.TUESDAY -> "THỨ BA"
                      Calendar.WEDNESDAY -> "THỨ TƯ"
                      Calendar.THURSDAY -> "THỨ NĂM"
                      Calendar.FRIDAY -> "THỨ SÁU"
                      Calendar.SATURDAY -> "THỨ BẢY"
                      else -> "CHỦ NHẬT"
                  }

                  val jd = jdFromDate(dd, mm, yy)
                  val (lunarD, lunarM, lunarY, _) = convertSolar2Lunar(dd, mm, yy, 7.0)

                  val calTomorrow = (cal.clone() as Calendar).apply { add(Calendar.DAY_OF_YEAR, 1) }
                  val (tomLunarD, tomLunarM, _, _) = convertSolar2Lunar(
                      calTomorrow.get(Calendar.DAY_OF_MONTH),
                      calTomorrow.get(Calendar.MONTH) + 1,
                      calTomorrow.get(Calendar.YEAR),
                      7.0
                  )

                  var lunarSpecialReminder: String? = null
                  var isRamOrMung1Today = false

                  when {
                      lunarD == 1 -> {
                          lunarSpecialReminder = "🌕 HÔM NAY MÙNG 1 THÁNG $lunarM ÂM"
                          isRamOrMung1Today = true
                      }
                      lunarD == 15 -> {
                          lunarSpecialReminder = "🌕 HÔM NAY NGÀY RẰM THÁNG $lunarM"
                          isRamOrMung1Today = true
                      }
                      tomLunarD == 1 -> {
                          lunarSpecialReminder = "🌘 NGÀY MAI MÙNG 1 THÁNG $tomLunarM ÂM"
                      }
                      lunarD == 14 -> {
                          lunarSpecialReminder = "🌖 NGÀY MAI LÀ RẰM THÁNG $lunarM"
                      }
                  }

                  val dayCanIdx = (jd + 9) % 10
                  val dayChiIdx = (jd + 1) % 12
                  val dayCanChi = "${CAN[dayCanIdx]} ${CHI[dayChiIdx]}"

                  val yearCanIdx = (lunarY + 6) % 10
                  val yearChiIdx = (lunarY + 8) % 12
                  val yearCanChi = "${CAN[yearCanIdx]} ${CHI[yearChiIdx]}"

                  val monthCanIdx = (lunarY * 12 + lunarM + 3) % 10
                  val monthChiIdx = (lunarM + 1) % 12
                  val monthCanChi = "${CAN[monthCanIdx]} ${CHI[monthChiIdx]}"

                  val startRatCanIdx = (dayCanIdx % 5) * 2
                  val curHourChiIdx = ((hour + 1) / 2) % 12
                  val curHourCanIdx = (startRatCanIdx + curHourChiIdx) % 10
                  val currentHourCanChi = "${CAN[curHourCanIdx]} ${CHI[curHourChiIdx]}"

                  val hoangDaoHourIndices = getHoangDaoHourIndices(dayChiIdx)
                  val isCurrentHourHoangDao = hoangDaoHourIndices.contains(curHourChiIdx)
                  val gioHoangDaoShort = hoangDaoHourIndices.joinToString(", ") { hChi ->
                      "${CHI[hChi]} (${HOUR_RANGES[hChi]})"
                  }

                  val isHoangDaoDay = checkIsHoangDaoDay(lunarM, dayChiIdx)
                  val sexagenaryIdx = getSexagenaryIndex(dayCanIdx, dayChiIdx)
                  val menhNgayNapAm = NAP_AM[(sexagenaryIdx / 2) % NAP_AM.size]
                  val quotePair = QUOTES[jd % QUOTES.size]

                  return CalendarDayInfo(
                      solarDay = dd,
                      solarMonth = mm,
                      solarYear = yy,
                      weekOfYear = week,
                      dayOfWeekStr = dowStr,
                      lunarDay = lunarD,
                      lunarMonth = lunarM,
                      lunarYear = lunarY,
                      currentHourCanChi = currentHourCanChi,
                      isCurrentHourHoangDao = isCurrentHourHoangDao,
                      dayCanChi = dayCanChi,
                      monthCanChi = monthCanChi,
                      yearCanChi = yearCanChi,
                      zodiacEmoji = ZODIAC_EMOJI[dayChiIdx],
                      isHoangDaoDay = isHoangDaoDay,
                      gioHoangDaoShort = gioHoangDaoShort,
                      menhNgayNapAm = menhNgayNapAm,
                      quoteText = quotePair.first,
                      quoteAuthor = quotePair.second,
                      lunarSpecialReminder = lunarSpecialReminder,
                      isRamOrMung1Today = isRamOrMung1Today
                  )
              }

              private fun getSexagenaryIndex(canIdx: Int, chiIdx: Int): Int {
                  for (i in 0 until 60) {
                      if (i % 10 == canIdx && i % 12 == chiIdx) return i
                  }
                  return 0
              }

              private fun getHoangDaoHourIndices(dayChiIdx: Int): IntArray {
                  return when (dayChiIdx % 6) {
                      0 -> intArrayOf(0, 1, 3, 6, 8, 9)
                      1 -> intArrayOf(2, 3, 5, 8, 10, 11)
                      2 -> intArrayOf(0, 1, 4, 5, 7, 10)
                      3 -> intArrayOf(0, 2, 3, 6, 7, 9)
                      4 -> intArrayOf(2, 4, 5, 8, 9, 11)
                      else -> intArrayOf(1, 4, 6, 7, 10, 11)
                  }
              }

              private fun checkIsHoangDaoDay(lunarMonth: Int, dayChiIdx: Int): Boolean {
                  val startChi = when (lunarMonth) {
                      1, 7 -> 0
                      2, 8 -> 2
                      3, 9 -> 4
                      4, 10 -> 6
                      5, 11 -> 8
                      else -> 10
                  }
                  val offset = (dayChiIdx - startChi + 12) % 12
                  return offset == 0 || offset == 1 || offset == 4 || offset == 5 || offset == 7 || offset == 10
              }

              private fun jdFromDate(dd: Int, mm: Int, yy: Int): Int {
                  val a = (14 - mm) / 12
                  val y = yy + 4800 - a
                  val m = mm + 12 * a - 3
                  var jd = dd + (153 * m + 2) / 5 + 365 * y + y / 4 - y / 100 + y / 400 - 32045
                  if (jd < 2299161) {
                      jd = dd + (153 * m + 2) / 5 + 365 * y + y / 4 - 32083
                  }
                  return jd
              }

              private fun getNewMoonDay(k: Int, timeZone: Double): Int {
                  val t = k / 1236.85
                  val t2 = t * t
                  val t3 = t2 * t
                  val dr = Math.PI / 180.0
                  var jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * t2 - 0.000000155 * t3
                  jd1 += 0.00033 * sin((166.56 + 132.87 * t - 0.009173 * t2) * dr)
                  val m = 359.2242 + 29.10535608 * k - 0.0000333 * t2 - 0.00000347 * t3
                  val mpr = 306.0253 + 385.81691806 * k + 0.0107306 * t2 + 0.00001236 * t3
                  val f = 21.2964 + 390.67050646 * k - 0.0016528 * t2 - 0.00000239 * t3
                  var c1 = (0.1734 - 0.000393 * t) * sin(m * dr) + 0.0021 * sin(2 * dr * m)
                  c1 = c1 - 0.4068 * sin(mpr * dr) + 0.0161 * sin(dr * 2 * mpr)
                  c1 -= 0.0004 * sin(dr * 3 * mpr)
                  c1 = c1 + 0.0104 * sin(dr * 2 * f) - 0.0051 * sin(dr * (m + mpr))
                  c1 = c1 - 0.0074 * sin(dr * (m - mpr)) + 0.0004 * sin(dr * (2 * f + m))
                  c1 = c1 - 0.0004 * sin(dr * (2 * f - m)) - 0.0006 * sin(dr * (2 * f + mpr))
                  c1 += 0.0010 * sin(dr * (2 * f - mpr)) + 0.0005 * sin(dr * (2 * mpr + m))
                  val deltat = if (t < -11) {
                      0.001 + 0.000839 * t + 0.0002261 * t2 - 0.00000845 * t3 - 0.000000081 * t * t3
                  } else {
                      -0.000278 + 0.000265 * t + 0.000262 * t2
                  }
                  val jdNew = jd1 + c1 - deltat
                  return floor(jdNew + 0.5 + timeZone / 24.0).toInt()
              }

              private fun getSunLongitude(jdn: Int, timeZone: Double): Int {
                  val t = (jdn - 2451545.5 - timeZone / 24.0) / 36525.0
                  val t2 = t * t
                  val dr = Math.PI / 180.0
                  val m = 357.52910 + 35999.05030 * t - 0.0001559 * t2 - 0.00000048 * t * t2
                  val l0 = 280.46645 + 36000.76983 * t + 0.0003032 * t2
                  var dl = (1.914600 - 0.004817 * t - 0.000014 * t2) * sin(dr * m)
                  dl += (0.019993 - 0.000101 * t) * sin(dr * 2 * m) + 0.000290 * sin(dr * 3 * m)
                  var l = l0 + dl
                  l *= dr
                  l -= Math.PI * 2 * floor(l / (Math.PI * 2))
                  return floor(l / Math.PI * 6.0).toInt()
              }

              private fun getLunarMonth11(yy: Int, timeZone: Double): Int {
                  val off = jdFromDate(31, 12, yy) - 2415021
                  val k = floor(off / 29.530588853).toInt()
                  var nm = getNewMoonDay(k, timeZone)
                  val sunLong = getSunLongitude(nm, timeZone)
                  if (sunLong >= 9) {
                      nm = getNewMoonDay(k - 1, timeZone)
                  }
                  return nm
              }

              private fun getLeapMonthOffset(a11: Int, timeZone: Double): Int {
                  val k = floor((a11 - 2415021.076998695) / 29.530588853 + 0.5).toInt()
                  var last: Int
                  var i = 1
                  var arc = getSunLongitude(getNewMoonDay(k + i, timeZone), timeZone)
                  do {
                      last = arc
                      i++
                      arc = getSunLongitude(getNewMoonDay(k + i, timeZone), timeZone)
                  } while (arc != last && i < 14)
                  return i - 1
              }

              private fun convertSolar2Lunar(dd: Int, mm: Int, yy: Int, timeZone: Double): IntArray {
                  val dayNumber = jdFromDate(dd, mm, yy)
                  val k = floor((dayNumber - 2415021.076998695) / 29.530588853).toInt()
                  var monthStart = getNewMoonDay(k + 1, timeZone)
                  if (monthStart > dayNumber) {
                      monthStart = getNewMoonDay(k, timeZone)
                  }
                  var a11 = getLunarMonth11(yy, timeZone)
                  var b11 = a11
                  var lunarYear: Int
                  if (a11 >= monthStart) {
                      lunarYear = yy
                      a11 = getLunarMonth11(yy - 1, timeZone)
                  } else {
                      lunarYear = yy + 1
                      b11 = getLunarMonth11(yy + 1, timeZone)
                  }
                  val lunarDay = dayNumber - monthStart + 1
                  val diff = ((monthStart - a11) / 29).toInt()
                  var lunarLeap = 0
                  var lunarMonth = diff + 11
                  if (b11 - a11 > 365) {
                      val leapMonthDiff = getLeapMonthOffset(a11, timeZone)
                      if (diff >= leapMonthDiff) {
                          lunarMonth = diff + 10
                          if (diff == leapMonthDiff) {
                              lunarLeap = 1
                          }
                      }
                  }
                  if (lunarMonth > 12) {
                      lunarMonth -= 12
                  }
                  if (lunarMonth >= 11 && diff < 4) {
                      lunarYear -= 1
                  }
                  return intArrayOf(lunarDay, lunarMonth, lunarYear, lunarLeap)
              }
          }
