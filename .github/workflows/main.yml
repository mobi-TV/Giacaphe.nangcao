              private fun createDynamicPriceRow(item: DynamicRow): LinearLayout {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(1.4f), 0, dp(1.4f))
                  }

                  val tvLbl = GradientTextView(this).apply {
                      text = item.label
                      isSingleLine = true
                      setTextSize(TypedValue.COMPLEX_UNIT_DIP, 9.6f)
                      setShadowLayer(3f, 0f, 1f, Color.argb(225, 0, 0, 0))
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  dynamicPrimaryViews.add(tvLbl)

                  val displayVal = if (item.muted && item.label.contains("Cập nhật", ignoreCase = true)) {
                      val dot = if (isLastFetchLive) "🟢" else "🟡"
                      "$dot ${item.valText}"
                  } else {
                      item.valText
                  }

                  val tvVal = GradientTextView(this).apply {
                      text = displayVal
                      isSingleLine = true
                      setTextSize(TypedValue.COMPLEX_UNIT_DIP, if (item.muted) 9.0f else 10.3f)
                      typeface = if (item.muted) Typeface.NORMAL else Typeface.DEFAULT_BOLD
                      gravity = Gravity.END
                      setShadowLayer(3f, 0f, 1f, Color.argb(230, 0, 0, 0))
                      setPadding(dp(4f), 0, 0, 0)
                  }
                  if (item.muted) dynamicPrimaryViews.add(tvVal) else dynamicHighlightViews.add(tvVal)

                  row.addView(tvLbl)
                  row.addView(tvVal)

                  if (item.badge.isNotBlank() && item.style != "none") {
                      val tvBadge = TextView(this).apply {
                          isSingleLine = true
                          setTextSize(TypedValue.COMPLEX_UNIT_DIP, 8.0f)
                          typeface = Typeface.DEFAULT_BOLD
                          setPadding(dp(3.5f), dp(0.6f), dp(3.5f), dp(0.6f))
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply {
                              leftMargin = dp(3.5f)
                          }
                      }
                      styleDynamicBadge(tvBadge, item.badge, item.style)
                      if (tvBadge.visibility == View.VISIBLE) {
                          row.addView(tvBadge)
                      }
                  }

                  return row
              }

              private fun styleDynamicBadge(badge: TextView, textRaw: String, styleRaw: String) {
                  val t = textRaw.trim()
                  val st = styleRaw.trim().lowercase(Locale.ROOT)

                  if (t.isEmpty() || st == "none" || t == "0" || t == "+0" || t == "-0" || t.equals("Ổn định", ignoreCase = true)) {
                      badge.visibility = View.GONE
                      return
                  }

                  badge.visibility = View.VISIBLE
                  badge.text = t
                  val bg = GradientDrawable().apply { cornerRadius = dp(4f).toFloat() }

                  val effectiveStyle = if (st.isEmpty()) {
                      when {
                          t.contains("Tăng", true) -> "trend_up"
                          t.contains("Giảm", true) -> "trend_down"
                          t.contains("Đi ngang", true) -> "neutral"
                          t.startsWith("+") -> "up"
                          t.startsWith("-") -> "down"
                          else -> "neutral"
                      }
                  } else st

                  when (effectiveStyle) {
                      "up" -> {
                          badge.setTextColor(Color.parseColor("#6EE7B7"))
                          bg.setColor(Color.argb(145, 5, 150, 105))
                      }
                      "down" -> {
                          badge.setTextColor(Color.parseColor("#FCA5A5"))
                          bg.setColor(Color.argb(165, 220, 38, 38))
                      }
                      "trend_up" -> {
                          badge.setTextColor(Color.parseColor("#5EEAD4"))
                          bg.setColor(Color.argb(150, 13, 148, 136))
                      }
                      "trend_down" -> {
                          badge.setTextColor(Color.parseColor("#FCA5A5"))
                          bg.setColor(Color.argb(165, 185, 28, 28))
                      }
                      "alert" -> {
                          badge.setTextColor(Color.parseColor("#FEF08A"))
                          bg.setColor(Color.argb(170, 180, 83, 9))
                      }
                      else -> {
                          badge.setTextColor(Color.parseColor("#E2E8F0"))
                          bg.setColor(Color.argb(95, 100, 116, 139))
                      }
                  }
                  badge.background = bg
              }

              private fun fetchCloudBoardAsync(force: Boolean, showToast: Boolean) {
                  if (isFetchingPrices) return
                  if (!force && !PriceApiClient.isWithinActiveHours(boardData.config) && boardData.hasAnyValidPrice()) return

                  isFetchingPrices = true
                  val snapshot = boardData

                  ioExecutor.execute {
                      try {
                          val res = PriceApiClient.fetchBoardData(this@CalendarAccessibilityService, snapshot)
                          if (res != null) {
                              boardData = res.data
                              isLastFetchLive = true
                              getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                                  .edit()
                                  .putString(KEY_CACHED_BOARD, res.data.toJson().toString())
                                  .apply()

                              mainHandler.post {
                                  renderDynamicBoardUI()
                                  refreshCalendarDataUI()
                                  scheduleNextHourlyPriceFetch()
                                  if (showToast) {
                                      val extraMsg = if (res.migratedToNewUrl) " (Đã tự chuyển server mới)" else ""
                                      Toast.makeText(
                                          this@CalendarAccessibilityService,
                                          "✅ Đã đồng bộ dữ liệu động (${res.elapsedMs}ms)$extraMsg",
                                          Toast.LENGTH_SHORT
                                      ).show()
                                  }
                              }
                          } else if (showToast) {
                              mainHandler.post {
                                  val activeUrl = PriceApiClient.getActiveApiUrl(this@CalendarAccessibilityService)
                                  val msg = if (!activeUrl.startsWith("http")) {
                                      "⚠️ Bạn chưa dán link API Vercel vào PriceApiClient.kt!"
                                  } else {
                                      "⚠️ Không kết nối được API, đang giữ dữ liệu cache."
                                  }
                                  Toast.makeText(this@CalendarAccessibilityService, msg, Toast.LENGTH_LONG).show()
                              }
                          }
                      } finally {
                          isFetchingPrices = false
                      }
                  }
              }

              /** Dựng lại toàn bộ bảng giá Cột 1, Cột 2, dòng topExtra và Ticker từ JSON động */
              private fun renderDynamicBoardUI() {
                  val leftBox = priceColLeftItems ?: return
                  val rightBox = priceColRightItems ?: return

                  // Cập nhật dòng phụ đỉnh (VD: Thời tiết Ea Kiết)
                  val extra = boardData.config.topExtra.trim()
                  if (extra.isNotEmpty()) {
                      tvTopExtra.text = extra
                      tvTopExtra.visibility = View.VISIBLE
                  } else {
                      tvTopExtra.visibility = View.GONE
                  }

                  tvPriceCol1Header.text = boardData.col1.title
                  tvPriceCol2Header.text = boardData.col2.title

                  leftBox.removeAllViews()
                  rightBox.removeAllViews()
                  dynamicPrimaryViews.clear()
                  dynamicHighlightViews.clear()

                  for (item in boardData.col1.items) {
                      leftBox.addView(createDynamicPriceRow(item))
                  }
                  for (item in boardData.col2.items) {
                      rightBox.addView(createDynamicPriceRow(item))
                  }

                  renderTickerLine()
                  applyTextAndCircleColors()
              }

              private fun renderTickerLine() {
                  val list = boardData.tickers
                  if (list.isEmpty()) {
                      tvTickerText.text = "☕ Đang chờ dữ liệu..."
                      tvTickerBadge.visibility = View.GONE
                      return
                  }
                  val item = list[tickerPageIdx % list.size]
                  tvTickerText.text = item.text
                  styleDynamicBadge(tvTickerBadge, item.badge, item.style)
              }

              private fun refreshCalendarDataUI() {
                  lastRenderedHourKey = VietCalendarEngine.currentHourKey(dayOffset)
                  val info = VietCalendarEngine.compute(dayOffset)

                  tvTopDow.text = "•  ${info.dayOfWeekStr}  •"
                  if (info.isHoangDaoDay) {
                      tvHoangDaoPill.text = "★ HOÀNG ĐẠO"
                      tvHoangDaoPill.setTextColor(Color.parseColor("#991B1B"))
                  } else {
                      tvHoangDaoPill.text = "★ HẮC ĐẠO"
                      tvHoangDaoPill.setTextColor(Color.parseColor("#1F2937"))
                  }

                  tvSolarYear.text = "Năm: ${info.solarYear}"
                  solarCircleView.dayValueText = String.format(Locale.US, "%02d", info.solarDay)
                  solarCircleView.monthValueText = String.format(Locale.US, "%02d", info.solarMonth)
                  solarCircleView.badgeEmoji = "☀️"
                  solarCircleView.invalidate()

                  val dayTag = when (dayOffset) {
                      0 -> "Hôm nay"
                      -1 -> "Hôm qua"
                      1 -> "Ngày mai"
                      else -> if (dayOffset > 0) "+$dayOffset ngày" else "$dayOffset ngày"
                  }
                  tvSolarSubInfo.text = "Tuần ${info.weekOfYear} • $dayTag"

                  tvLunarYear.text = "Năm: ${info.yearCanChi}"
                  lunarCircleView.dayValueText = String.format(Locale.US, "%02d", info.lunarDay)
                  lunarCircleView.monthValueText = String.format(Locale.US, "%02d", info.lunarMonth)
                  lunarCircleView.badgeEmoji = info.zodiacEmoji
                  lunarCircleView.isSpecialHighlight = info.isRamOrMung1Today
                  lunarCircleView.invalidate()

                  tvLunarSubInfo.text = "Ngày ${info.dayCanChi} • Thg ${info.monthCanChi}"
                  if (info.lunarSpecialReminder != null) {
                      tvRamMung1Badge.text = info.lunarSpecialReminder
                      tvRamMung1Badge.visibility = View.VISIBLE
                  } else {
                      tvRamMung1Badge.visibility = View.GONE
                  }

                  val hourStar = if (info.isCurrentHourHoangDao) "★ " else ""
                  tvGioHoangDaoLine.text = "★ Giờ Hoàng Đạo: ${info.gioHoangDaoShort}"
                  tvMenhNgayLine.text = "✦ Mệnh: ${info.menhNgayNapAm}  •  Giờ: $hourStar${info.currentHourCanChi}"

                  val remoteQuote = boardData.config.quote.trim()
                  tvQuoteLine.text = if (remoteQuote.isNotEmpty()) {
                      remoteQuote
                  } else {
                      "“${info.quoteText}” — ${info.quoteAuthor}"
                  }
              }

              private fun applyLayoutMode() {
                  val cRow = dualCirclesRow ?: return
                  val sCol = solarColumn ?: return
                  val lCol = lunarColumn ?: return
                  val cMid = calendarMidDivider ?: return
                  val dBand = detailsBand ?: return
                  val qBand = quoteBand ?: return
                  val pWrap = priceBoardWrapper ?: return
                  val pRow = priceTwoColsRow ?: return
                  val pLeft = priceColLeft ?: return
                  val pRight = priceColRight ?: return
                  val pMid = priceMidDivider ?: return
                  val pTicker = priceTickerRow ?: return

                  val isVerticalNarrow = (layoutModeIdx == 3)
                  val boardWidth = if (isVerticalNarrow) dp(268f) else dp(448f)

                  cRow.layoutParams = LinearLayout.LayoutParams(boardWidth, LinearLayout.LayoutParams.WRAP_CONTENT)
                  dBand.layoutParams = LinearLayout.LayoutParams(boardWidth, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      topMargin = dp(5f)
                  }
                  qBand.layoutParams = LinearLayout.LayoutParams(boardWidth, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      topMargin = dp(3f)
                  }
                  pWrap.layoutParams = LinearLayout.LayoutParams(boardWidth, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      topMargin = dp(5f)
                  }

                  solarCircleView.isCompactSize = true
                  lunarCircleView.isCompactSize = true
                  cRow.orientation = LinearLayout.HORIZONTAL
                  sCol.layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  lCol.layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  cMid.visibility = View.VISIBLE

                  when (layoutModeIdx) {
                      0 -> {
                          dBand.visibility = View.VISIBLE
                          qBand.visibility = View.VISIBLE
                      }
                      1 -> {
                          dBand.visibility = View.VISIBLE
                          qBand.visibility = View.GONE
                      }
                      2 -> {
                          dBand.visibility = View.GONE
                          qBand.visibility = View.GONE
                      }
                      else -> {
                          dBand.visibility = View.VISIBLE
                          qBand.visibility = View.GONE
                      }
                  }

                  when (priceDisplayMode) {
                      0 -> {
                          pWrap.visibility = View.VISIBLE
                          pRow.visibility = View.VISIBLE
                          pTicker.visibility = View.GONE
                          if (isVerticalNarrow) {
                              pRow.orientation = LinearLayout.VERTICAL
                              pMid.visibility = View.GONE
                              pLeft.layoutParams = LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                              )
                              pRight.layoutParams = LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                              ).apply { topMargin = dp(6f) }
                          } else {
                              pRow.orientation = LinearLayout.HORIZONTAL
                              pMid.visibility = View.VISIBLE
                              pLeft.layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.15f)
                              pRight.layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 0.85f)
                          }
                      }
                      1 -> {
                          pWrap.visibility = View.VISIBLE
                          pRow.visibility = View.GONE
                          pTicker.visibility = View.VISIBLE
                          renderTickerLine()
                      }
                      else -> {
                          pWrap.visibility = View.GONE
                      }
                  }
              }

              private fun applyTextAndCircleColors() {
                  var mainGrad: IntArray? = null
                  var accentGrad: IntArray? = null
                  var numGrad: IntArray? = null
                  var solidMain = Color.parseColor("#F8FAFC")
                  var solidAccent = Color.parseColor("#F1B81F")
                  var solidNum = Color.parseColor("#FDE047")

                  when (textColorIdx) {
                      0 -> {
                          mainGrad = intArrayOf(
                              Color.parseColor("#FFE600"),
                              Color.parseColor("#FBBF24"),
                              Color.parseColor("#FEF3C7")
                          )
                          accentGrad = intArrayOf(
                              Color.parseColor("#FFF000"),
                              Color.parseColor("#F1B81F"),
                              Color.parseColor("#FDE047")
                          )
                          numGrad = intArrayOf(
                              Color.parseColor("#FFF000"),
                              Color.parseColor("#F59E0B"),
                              Color.parseColor("#FDE047")
                          )
                      }
                      1 -> {
                          mainGrad = intArrayOf(
                              Color.parseColor("#FEF08A"),
                              Color.parseColor("#FFFFFF"),
                              Color.parseColor("#E2E8F0")
                          )
                          accentGrad = intArrayOf(
                              Color.parseColor("#FFE600"),
                              Color.parseColor("#F1B81F"),
                              Color.parseColor("#FEF9C3")
                          )
                          numGrad = intArrayOf(
                              Color.parseColor("#FFE600"),
                              Color.parseColor("#FBBF24"),
                              Color.parseColor("#FFFFFF")
                          )
                      }
                      2 -> {
                          mainGrad = intArrayOf(
                              Color.parseColor("#FFE600"),
                              Color.parseColor("#A7F3D0"),
                              Color.parseColor("#ECFDF5")
                          )
                          accentGrad = intArrayOf(
                              Color.parseColor("#FFE600"),
                              Color.parseColor("#34D399"),
                              Color.parseColor("#6EE7B7")
                          )
                          numGrad = intArrayOf(
                              Color.parseColor("#FFE600"),
                              Color.parseColor("#34D399"),
                              Color.parseColor("#10B981")
                          )
                      }
                      3 -> {
                          mainGrad = intArrayOf(
                              Color.parseColor("#FFE600"),
                              Color.parseColor("#BAE6FD"),
                              Color.parseColor("#ECFEFF")
                          )
                          accentGrad = intArrayOf(
                              Color.parseColor("#FFE600"),
                              Color.parseColor("#38BDF8"),
                              Color.parseColor("#7DD3FC")
                          )
                          numGrad = intArrayOf(
                              Color.parseColor("#FFE600"),
                              Color.parseColor("#38BDF8"),
                              Color.parseColor("#06B6D4")
                          )
                      }
                      else -> {
                          mainGrad = null
                          accentGrad = null
                          numGrad = null
                          solidMain = Color.parseColor("#F1F5F9")
                          solidAccent = Color.parseColor("#F1B81F")
                          solidNum = Color.parseColor("#FDE047")
                      }
                  }

                  for (v in staticPrimaryViews) {
                      v.setTextColor(solidMain)
                      v.setLeftToRightGradient(mainGrad)
                  }
                  for (v in dynamicPrimaryViews) {
                      v.setTextColor(solidMain)
                      v.setLeftToRightGradient(mainGrad)
                  }
                  for (v in staticAccentViews) {
                      v.setTextColor(solidAccent)
                      v.setLeftToRightGradient(accentGrad)
                  }
                  for (v in staticHighlightViews) {
                      v.setTextColor(solidNum)
                      v.setLeftToRightGradient(numGrad)
                  }
                  for (v in dynamicHighlightViews) {
                      v.setTextColor(solidNum)
                      v.setLeftToRightGradient(numGrad)
                  }

                  solarCircleView.palette = DualMedallionCircleView.SOLAR_PALETTE
                  lunarCircleView.palette = DualMedallionCircleView.LUNAR_PALETTES[
                      lunarCircleColorIdx.coerceIn(0, DualMedallionCircleView.LUNAR_PALETTES.size - 1)
                  ]
              }

              /** Không dùng FLAG_BLUR_BEHIND để tránh nóng máy & giật lag GPU trên TV */
              private fun applyVisualStyle() {
                  val card = calendarCard ?: return
                  val dBand = detailsBand ?: return
                  val view = rootContainer ?: return

                  val bgAlpha = (((100 - transparencyPercent).coerceIn(0, 100)) * 255) / 100
                  val innerAlpha = (((100 - transparencyPercent).coerceIn(0, 100)) * 125) / 100

                  val cardDrawable = GradientDrawable().apply {
                      cornerRadius = dp(16f).toFloat()
                  }
                  val innerDrawable = GradientDrawable().apply {
                      cornerRadius = dp(9f).toFloat()
                  }

                  if (bgAlpha == 0 || bgThemeIdx == 4) {
                      cardDrawable.setColor(Color.TRANSPARENT)
                      innerDrawable.setColor(Color.TRANSPARENT)
                  } else {
                      when (bgThemeIdx) {
                          0 -> {
                              cardDrawable.setColor(Color.argb(bgAlpha, 11, 12, 16))
                              innerDrawable.setColor(Color.argb(innerAlpha, 22, 24, 35))
                          }
                          1 -> {
                              cardDrawable.setColor(Color.argb(bgAlpha, 18, 25, 40))
                              innerDrawable.setColor(Color.argb(innerAlpha, 30, 41, 59))
                          }
                          2 -> {
                              cardDrawable.colors = intArrayOf(
                                  Color.argb(bgAlpha, 69, 10, 10),
                                  Color.argb(bgAlpha, 28, 10, 10)
                              )
                              cardDrawable.orientation = GradientDrawable.Orientation.TOP_BOTTOM
                              innerDrawable.setColor(Color.argb(innerAlpha, 24, 8, 8))
                          }
                          else -> {
                              cardDrawable.colors = intArrayOf(
                                  Color.argb(bgAlpha, 45, 26, 15),
                                  Color.argb(bgAlpha, 22, 14, 10)
                              )
                              cardDrawable.orientation = GradientDrawable.Orientation.TOP_BOTTOM
                              innerDrawable.setColor(Color.argb(innerAlpha, 18, 12, 9))
                          }
                      }
                  }

                  if (isEditMode && isMoveSubMode) {
                      cardDrawable.setStroke(dp(2f), Color.parseColor("#00F2FE"))
                  } else {
                      cardDrawable.setStroke(0, Color.TRANSPARENT)
                  }

                  if (bgAlpha > 0 && bgThemeIdx != 4) {
                      innerDrawable.setStroke(dp(0.8f).coerceAtLeast(1), Color.argb(95, 241, 184, 31))
                  } else {
                      innerDrawable.setStroke(0, Color.TRANSPARENT)
                  }

                  card.background = cardDrawable
                  dBand.background = innerDrawable
                  try { windowManager.updateViewLayout(view, params) } catch (_: Throwable) {}
              }

              private fun applyScale() {
                  val master = masterLayout ?: return
                  val s = scalePercent / 100f
                  master.pivotX = 0f
                  master.pivotY = 0f
                  master.scaleX = s
                  master.scaleY = s
              }

              private fun addSettingRow(parent: LinearLayout, title: String): TextView {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(6f), dp(2.2f), dp(6f), dp(2.2f))
                  }

                  val tvName = TextView(this).apply {
                      text = title
                      setTextSize(TypedValue.COMPLEX_UNIT_DIP, 10f)
                      setTextColor(Color.argb(235, 255, 255, 255))
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 0.92f)
                  }

                  val tvVal = TextView(this).apply {
                      setTextSize(TypedValue.COMPLEX_UNIT_DIP, 10f)
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#FDE047"))
                      gravity = Gravity.END
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.28f)
                  }

                  row.addView(tvName)
                  row.addView(tvVal)
                  settingRowContainers.add(row)
                  parent.addView(row)
                  return tvVal
              }

              private fun adjustSettingValue(dir: Int) {
                  val prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit()
                  when (selectedMenuRow) {
                      0 -> {
                          scalePercent = (scalePercent + dir * 5).coerceIn(40, 150)
                          prefs.putInt(KEY_SCALE_PCT, scalePercent).apply()
                          applyScale()
                      }
                      1 -> {
                          transparencyPercent = (transparencyPercent + dir * 10).coerceIn(0, 100)
                          prefs.putInt(KEY_TRANSPARENCY, transparencyPercent).apply()
                          applyVisualStyle()
                      }
                      2 -> {
                          textColorIdx = (textColorIdx + dir + textThemeNames.size) % textThemeNames.size
                          prefs.putInt(KEY_TEXT_COLOR, textColorIdx).apply()
                          applyTextAndCircleColors()
                      }
                      3 -> {
                          lunarCircleColorIdx = (lunarCircleColorIdx + dir + lunarCircleThemeNames.size) % lunarCircleThemeNames.size
                          prefs.putInt(KEY_LUNAR_CIRCLE_COLOR, lunarCircleColorIdx).apply()
                          applyTextAndCircleColors()
                      }
                      4 -> {
                          bgThemeIdx = (bgThemeIdx + dir + bgThemeNames.size) % bgThemeNames.size
                          prefs.putInt(KEY_BG_THEME, bgThemeIdx).apply()
                          applyVisualStyle()
                      }
                      5 -> {
                          layoutModeIdx = (layoutModeIdx + dir + layoutModeNames.size) % layoutModeNames.size
                          prefs.putInt(KEY_LAYOUT_MODE, layoutModeIdx).apply()
                          applyLayoutMode()
                      }
                      6 -> {
                          priceDisplayMode = (priceDisplayMode + dir + priceModeNames.size) % priceModeNames.size
                          prefs.putInt(KEY_PRICE_MODE, priceDisplayMode).apply()
                          applyLayoutMode()
                      }
                      7 -> {
                          dayOffset = (dayOffset + dir).coerceIn(-365, 365)
                          lastRenderedHourKey = ""
                          refreshCalendarDataUI()
                      }
                      8 -> {
                          isMoveSubMode = true
                          applyVisualStyle()
                      }
                  }
                  updateSettingsDockUI()
              }

              private fun updateSettingsDockUI() {
                  val dock = settingsDock ?: return
                  val banner = moveHintBanner ?: return

                  if (!isEditMode) {
                      dock.visibility = View.GONE
                      banner.visibility = View.GONE
                      return
                  }

                  if (isMoveSubMode) {
                      dock.visibility = View.GONE
                      banner.visibility = View.VISIBLE
                      return
                  }

                  banner.visibility = View.GONE
                  dock.visibility = View.VISIBLE

                  val scaleLabel = if (scalePercent == 75) "75% (Chuẩn TV 75\")" else "$scalePercent%"
                  tvValScale.text = "◀ $scaleLabel ▶"

                  val transLabel = when (transparencyPercent) {
                      0 -> "0% (Nền đặc)"
                      100 -> "100% (Trong suốt)"
                      else -> "$transparencyPercent%"
                  }
                  tvValTransparency.text = "◀ $transLabel ▶"
                  tvValTextColor.text = "◀ ${textThemeNames[textColorIdx]} ▶"
                  tvValLunarCircleColor.text = "◀ ${lunarCircleThemeNames[lunarCircleColorIdx]} ▶"
                  tvValBgTheme.text = "◀ ${bgThemeNames[bgThemeIdx]} ▶"
                  tvValLayoutMode.text = "◀ ${layoutModeNames[layoutModeIdx]} ▶"
                  tvValPriceMode.text = "◀ ${priceModeNames[priceDisplayMode]} (OK: Tải ngay) ▶"

                  val dayLabel = when (dayOffset) {
                      0 -> "Hôm nay"
                      -1 -> "Hôm qua (-1)"
                      1 -> "Ngày mai (+1)"
                      else -> if (dayOffset > 0) "+$dayOffset ngày" else "$dayOffset ngày"
                  }
                  tvValDayOffset.text = "◀ $dayLabel (OK: Hôm nay) ▶"

                  for (i in settingRowContainers.indices) {
                      val row = settingRowContainers[i]
                      if (i == selectedMenuRow) {
                          row.background = GradientDrawable().apply {
                              cornerRadius = dp(6f).toFloat()
                              setColor(Color.argb(80, 241, 184, 31))
                              setStroke(dp(1f), Color.parseColor("#F1B81F"))
                          }
                      } else {
                          row.background = null
                      }
                  }
              }

              fun openEditModeOnHomeScreen() {
                  mainHandler.postDelayed({
                      currentForegroundPkg = "com.spocky.projengmenu"
                      currentLauncherSimpleClass = "mainactivity"
                      isTopBarSettingsIconFocused = false
                      enableEditMode(true)
                  }, 350L)
              }

              fun enableEditMode(enable: Boolean) {
                  if (rootContainer == null) ensureOverlayCreated()
                  val view = rootContainer ?: return
                  isEditMode = enable
                  isMoveSubMode = false
                  selectedMenuRow = 0

                  if (enable) {
                      view.visibility = View.VISIBLE
                      params.flags = (params.flags and WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE.inv()) or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                      view.isFocusable = true
                      view.isFocusableInTouchMode = true
                      view.requestFocus()
                      fetchCloudBoardAsync(force = true, showToast = false)
                  } else {
                      params.flags = params.flags or
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                      verifyActiveWindowAndVisibility()
                  }
                  updateSettingsDockUI()
                  applyVisualStyle()
              }

              private fun moveBy(dx: Int, dy: Int) {
                  val view = rootContainer ?: return
                  val metrics = resources.displayMetrics
                  params.x = (params.x + dx).coerceIn(-dp(220f), metrics.widthPixels - dp(60f))
                  params.y = (params.y + dy).coerceIn(-dp(120f), metrics.heightPixels - dp(40f))
                  try { windowManager.updateViewLayout(view, params) } catch (_: Throwable) {}
                  savePosition()
              }

              private fun savePosition() {
                  getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit()
                      .putInt(KEY_X, params.x)
                      .putInt(KEY_Y, params.y)
                      .apply()
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
                  mainHandler.removeCallbacksAndMessages(null)
                  try { unregisterReceiver(systemEventReceiver) } catch (_: Throwable) {}
                  try { connectivityManager?.unregisterNetworkCallback(networkCallback) } catch (_: Throwable) {}
                  rootContainer?.let {
                      try { windowManager.removeView(it) } catch (_: Throwable) {}
                  }
                  rootContainer = null
              }
          }
          EOF

          # 4.10. Tạo MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/daklak/eakiet/lichvannien/MainActivity.kt
          package com.daklak.eakiet.lichvannien

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val activeAcc = CalendarAccessibilityService.instance
                  if (activeAcc != null) {
                      try {
                          val homeIntent = Intent(Intent.ACTION_MAIN).apply {
                              addCategory(Intent.CATEGORY_HOME)
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK
                          }
                          startActivity(homeIntent)
                      } catch (_: Throwable) {}

                      activeAcc.openEditModeOnHomeScreen()
                      Toast.makeText(
                          this,
                          "Đã mở Cài Đặt Lịch Song Tròn & SDUI v13.0! Chọn Mục 9 (OK) để di chuyển",
                          Toast.LENGTH_LONG
                      ).show()
                      finish()
                      return
                  }

                  Toast.makeText(
                      this,
                      "Hãy bật 'Lịch Vạn Niên' trong Hỗ trợ tiếp cận (hoặc chạy lệnh ADB) để hiển thị!",
                      Toast.LENGTH_LONG
                  ).show()
                  try {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  } catch (_: Throwable) {
                      try { startActivity(Intent(Settings.ACTION_SETTINGS)) } catch (_: Throwable) {}
                  }
                  finish()
              }
          }
          EOF

