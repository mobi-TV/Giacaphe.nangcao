          data class FetchResult(
              val data: DynamicBoardData,
              val elapsedMs: Long,
              val migratedToNewUrl: Boolean
          )

          object PriceApiClient {

              // >>> 1. DÁN LINK API VERCEL CHÍNH CỦA BẠN VÀO ĐÂY <<<
              const val DEFAULT_API_URL = "[DÁN_LINK_API_VERCEL_CỦA_BẠN_VÀO_ĐÂY]"

              // >>> 2. (TÙY CHỌN) DÁN LINK RAW GITHUB bootstrap.json ĐỂ TỰ CỨU KHI ĐỔI SERVER <<<
              const val BOOTSTRAP_CONFIG_URL = "[DÁN_LINK_RAW_GITHUB_BOOTSTRAP_JSON_NẾU_CÓ]"

              private const val PREFS_NAME = "LichVanNien75Prefs"
              private const val KEY_ACTIVE_API_URL = "sdui_active_api_url"
              private const val KEY_CONSECUTIVE_FAILS = "sdui_fail_count"

              private val VN_TZ: TimeZone = TimeZone.getTimeZone("Asia/Ho_Chi_Minh")

              private fun isValidHttpUrl(url: String?): Boolean {
                  val u = url?.trim() ?: return false
                  return u.startsWith("http://") || u.startsWith("https://")
              }

              fun getActiveApiUrl(context: Context): String {
                  val saved = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      .getString(KEY_ACTIVE_API_URL, null)
                  return if (isValidHttpUrl(saved)) saved!!.trim() else DEFAULT_API_URL.trim()
              }

              private fun saveActiveApiUrl(context: Context, newUrl: String) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      .edit()
                      .putString(KEY_ACTIVE_API_URL, newUrl.trim())
                      .putInt(KEY_CONSECUTIVE_FAILS, 0)
                      .apply()
              }

              fun isWithinActiveHours(config: RemoteConfig): Boolean {
                  val cal = Calendar.getInstance(VN_TZ)
                  val hour = cal.get(Calendar.HOUR_OF_DAY)
                  val fromH = config.activeFromHour.coerceIn(0, 23)
                  val toH = config.activeToHour.coerceIn(fromH, 23)
                  return hour in fromH..toH
              }

              /** Tính chính xác thời gian chờ đến đầu giờ tiếp theo (:00:03) theo khung giờ config từ xa */
              fun computeDelayUntilNextScheduledFetchMs(config: RemoteConfig): Long {
                  val fromH = config.activeFromHour.coerceIn(0, 23)
                  val toH = config.activeToHour.coerceIn(fromH, 23)

                  val now = Calendar.getInstance(VN_TZ)
                  val next = (now.clone() as Calendar).apply {
                      set(Calendar.MINUTE, 0)
                      set(Calendar.SECOND, 3)
                      set(Calendar.MILLISECOND, 0)
                  }

                  val currentHour = now.get(Calendar.HOUR_OF_DAY)
                  when {
                      currentHour < fromH -> {
                          next.set(Calendar.HOUR_OF_DAY, fromH)
                      }
                      currentHour in fromH until toH -> {
                          next.set(Calendar.HOUR_OF_DAY, currentHour + 1)
                      }
                      else -> {
                          next.add(Calendar.DAY_OF_YEAR, 1)
                          next.set(Calendar.HOUR_OF_DAY, fromH)
                      }
                  }

                  val diff = next.timeInMillis - now.timeInMillis
                  return diff.coerceAtLeast(15_000L)
              }

              private fun httpGetJson(targetUrl: String): Pair<JSONObject, Long>? {
                  if (!isValidHttpUrl(targetUrl)) return null
                  var conn: HttpURLConnection? = null
                  val startMs = System.currentTimeMillis()
                  return try {
                      val url = URL(targetUrl)
                      conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "GET"
                          connectTimeout = 5000
                          readTimeout = 5000
                          useCaches = false
                          setRequestProperty("Accept", "application/json")
                          setRequestProperty("User-Agent", "LichVanNienTV/13.0-SDUI (AndroidTV)")
                      }

                      if (conn.responseCode in 200..299) {
                          val reader = BufferedReader(InputStreamReader(conn.inputStream, Charsets.UTF_8))
                          val sb = StringBuilder()
                          var line: String?
                          while (reader.readLine().also { line = it } != null) {
                              sb.append(line)
                          }
                          reader.close()
                          val elapsed = System.currentTimeMillis() - startMs
                          JSONObject(sb.toString()) to elapsed
                      } else {
                          null
                      }
                  } catch (_: Throwable) {
                      null
                  } finally {
                      try { conn?.disconnect() } catch (_: Throwable) {}
                  }
              }

              /** Đọc dữ liệu động kèm cơ chế tự chuyển domain qua nextApiUrl hoặc bootstrap.json dự phòng */
              fun fetchBoardData(context: Context, currentCache: DynamicBoardData): FetchResult? {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val currentUrl = getActiveApiUrl(context)

                  val primary = httpGetJson(currentUrl)
                  if (primary != null) {
                      prefs.edit().putInt(KEY_CONSECUTIVE_FAILS, 0).apply()
                      val parsed = DynamicBoardData.fromJson(primary.first, currentCache)

                      // Lớp 1: Tự động chuyển hộ khẩu nếu server trả về config.nextApiUrl
                      val nextUrl = parsed.config.nextApiUrl
                      var migrated = false
                      if (isValidHttpUrl(nextUrl) && nextUrl != currentUrl) {
                          saveActiveApiUrl(context, nextUrl)
                          migrated = true
                      }
                      return FetchResult(parsed, primary.second, migrated)
                  }

                  // Thất bại -> tăng bộ đếm; nếu lỗi >= 3 lần hoặc chưa cài URL chính thì gọi bootstrap.json
                  val fails = prefs.getInt(KEY_CONSECUTIVE_FAILS, 0) + 1
                  prefs.edit().putInt(KEY_CONSECUTIVE_FAILS, fails).apply()

                  if ((fails >= 3 || !isValidHttpUrl(currentUrl)) && isValidHttpUrl(BOOTSTRAP_CONFIG_URL)) {
                      val boot = httpGetJson(BOOTSTRAP_CONFIG_URL)
                      val recoveredUrl = boot?.first?.optString("apiUrl", "")?.trim()
                      if (isValidHttpUrl(recoveredUrl) && recoveredUrl != currentUrl) {
                          saveActiveApiUrl(context, recoveredUrl!!)
                          val retry = httpGetJson(recoveredUrl)
                          if (retry != null) {
                              val parsed = DynamicBoardData.fromJson(retry.first, currentCache)
                              return FetchResult(parsed, retry.second, migratedToNewUrl = true)
                          }
                      }
                  }
                  return null
              }
          }
