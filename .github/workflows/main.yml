                                      if (item.isNotBlank()) tickersList.add(DynamicTicker(item.trim()))
                                  }
                              }
                          }
                      }
                      if (tickersList.isEmpty()) {
                          // Tự sinh ticker từ col1 & col2 nếu server không gửi mảng tickers
                          val firstRow = col1.items.firstOrNull()
                          val secondRow = col1.items.getOrNull(1)
                          if (firstRow != null) {
                              val txt = if (secondRow != null) {
                                  "${firstRow.label}: ${firstRow.valText}  •  ${secondRow.label}: ${secondRow.valText}"
                              } else {
                                  "${firstRow.label}: ${firstRow.valText}"
                              }
                              tickersList.add(DynamicTicker(txt, secondRow?.badge ?: firstRow.badge, secondRow?.style ?: firstRow.style))
                          } else {
                              tickersList.addAll(oldData.tickers)
                          }
                      }

                      return DynamicBoardData(parsedConfig, col1, col2, tickersList)
                  }

                  private fun parseColumn(
                      colObj: JSONObject?,
                      fallbackCol: DynamicColumn,
                      oldValMap: Map<String, String>
                  ): DynamicColumn {
                      if (colObj == null) return fallbackCol
                      val title = cleanStr(colObj, "title", fallbackCol.title)
                      val arr = colObj.optJSONArray("items") ?: return fallbackCol
                      val rows = mutableListOf<DynamicRow>()

                      for (i in 0 until arr.length()) {
                          val rObj = arr.optJSONObject(i) ?: continue
                          val label = cleanStr(rObj, "label")
                          if (label.isEmpty()) continue

                          val rawVal = cleanStr(rObj, "val", "--")
                          val finalVal = if ((rawVal.isEmpty() || rawVal == "--") && oldValMap.containsKey(label)) {
                              oldValMap[label] ?: "--"
                          } else {
                              rawVal.ifEmpty { "--" }
                          }

                          rows.add(
                              DynamicRow(
                                  label = label,
                                  valText = finalVal,
                                  badge = cleanStr(rObj, "badge"),
                                  style = cleanStr(rObj, "style", "none"),
                                  muted = rObj.optBoolean("muted", false)
                              )
                          )
                      }
                      return if (rows.isNotEmpty()) DynamicColumn(title, rows) else fallbackCol
                  }

                  private fun fromLegacyFlatJson(
                      obj: JSONObject,
                      oldData: DynamicBoardData,
                      oldValMap: Map<String, String>
                  ): DynamicBoardData {
                      fun getVal(key: String, label: String): String {
                          val v = cleanStr(obj, key, "--")
                          return if (v == "--") oldValMap[label] ?: "--" else v
                      }
                      fun inferStyle(chg: String): String = when {
                          chg.startsWith("+") -> "up"
                          chg.startsWith("-") && chg != "-0" -> "down"
                          chg.contains("Tăng", true) -> "trend_up"
                          chg.contains("Giảm", true) -> "trend_down"
                          chg.contains("Đi ngang", true) -> "neutral"
                          else -> "none"
                      }

                      val cfTT = getVal("cfThiTruong", "☕ Giá thị trường Đắk Lắk")
                      val cfTTChg = cleanStr(obj, "cfThiTruongChg", "0")
