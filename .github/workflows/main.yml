                          addAction(Intent.ACTION_SCREEN_ON)
                          addAction(Intent.ACTION_USER_PRESENT)
                          addAction(Intent.ACTION_CLOSE_SYSTEM_DIALOGS)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          registerReceiver(systemEventReceiver, filter, Context.RECEIVER_EXPORTED)
                      } else {
                          registerReceiver(systemEventReceiver, filter)
                      }
                  } catch (_: Throwable) {}

                  try {
                      connectivityManager = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val req = NetworkRequest.Builder()
                          .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                          .build()
                      connectivityManager?.registerNetworkCallback(req, networkCallback)
                  } catch (_: Throwable) {}
              }

              private fun loadLauncherPackages() {
                  launcherPackages.clear()
                  launcherPackages.add("com.spocky.projengmenu")
                  launcherPackages.add("com.spocky.projengmenu.debug")
                  launcherPackages.add("com.mitv.tvhome")
                  launcherPackages.add("com.google.android.tvlauncher")
                  launcherPackages.add("com.google.android.apps.tv.launcherx")
                  launcherPackages.add("com.google.android.leanbacklauncher")
                  launcherPackages.add("com.oversea.aslauncher")
                  launcherPackages.add("ca.dstudio.atvlauncher.pro")
                  launcherPackages.add("ca.dstudio.atvlauncher.free")

                  try {
                      val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
                      val list = packageManager.queryIntentActivities(intent, 0)
                      for (info in list) {
                          launcherPackages.add(info.activityInfo.packageName)
                      }
                  } catch (_: Throwable) {}
              }

              private fun isLauncherPkg(pkg: String): Boolean {
                  if (pkg.isEmpty()) return false
                  if (launcherPackages.contains(pkg)) return true
                  val lower = pkg.lowercase(Locale.ROOT)
                  return lower.contains("projengmenu") ||
                          lower.contains("tvlauncher") ||
                          lower.contains("leanbacklauncher") ||
                          lower.contains("launcherx") ||
                          lower.contains("atvlauncher") ||
                          lower.contains("aslauncher") ||
                          lower.contains("tvhome")
              }

              private fun isIgnoredSelfOrKeyboardPkg(pkg: String): Boolean {
                  return pkg == packageName ||
                          pkg == "com.daklak.eakiet.widget" ||
                          pkg.contains("inputmethod", ignoreCase = true) ||
                          pkg.contains("keyboard", ignoreCase = true) ||
                          pkg.contains("volume", ignoreCase = true)
              }

              private fun isSettingsOrDialogSimpleClass(simpleCls: String): Boolean {
                  if (simpleCls.isEmpty()) return false
                  return simpleCls.contains("settings") ||
                          simpleCls.contains("preference") ||
                          simpleCls.contains("guidedstep") ||
                          simpleCls.contains("dialog") ||
                          simpleCls.contains("bottomsheet") ||
                          simpleCls.contains("wallpaper") ||
                          simpleCls.contains("picker") ||
                          simpleCls.contains("chooser") ||
                          simpleCls.contains("onboarding") ||
                          simpleCls.contains("wizard") ||
                          simpleCls.contains("parental") ||
                          simpleCls.contains("about")
              }

              private fun isLauncherSubMenuOrSettingsOpen(rootNode: AccessibilityNodeInfo?): Boolean {
                  if (isSettingsOrDialogSimpleClass(currentLauncherSimpleClass)) return true
                  if (isTopBarSettingsIconFocused) return true
                  val root = rootNode ?: return false

                  val queue = ArrayDeque<AccessibilityNodeInfo>()
                  queue.add(root)
                  var visited = 0
                  val screenH = resources.displayMetrics.heightPixels
                  val topBarThreshold = (screenH * 0.18f).toInt()
                  val rect = Rect()

                  while (!queue.isEmpty() && visited < 120) {
                      val node = queue.removeFirst()
                      visited++

                      val idRes = node.viewIdResourceName?.substringAfterLast(':')?.lowercase(Locale.ROOT) ?: ""
                      if (idRes.isNotEmpty()) {
                          if (idRes.contains("guidedstep") ||
                              idRes.contains("guidedactions") ||
                              idRes.contains("guidance_") ||
                              idRes.contains("preference") ||
                              idRes.contains("settings_dialog") ||
                              idRes.contains("settings_preference") ||
                              idRes.contains("settings_container") ||
                              idRes.contains("action_fragment") ||
                              idRes.contains("design_bottom_sheet") ||
                              idRes.contains("alerttitle") ||
                              idRes.contains("select_dialog_listview")
                          ) {
                              return true
                          }
                      }

                      val cls = node.className?.toString()?.lowercase(Locale.ROOT) ?: ""
                      if (cls.contains("guidedstep") || cls.contains("preference")) {
                          return true
                      }

                      val txt = node.text?.toString()?.trim()?.lowercase(Locale.ROOT) ?: ""
                      val desc = node.contentDescription?.toString()?.trim()?.lowercase(Locale.ROOT) ?: ""

                      if (txt.isNotEmpty() || desc.isNotEmpty()) {
                          for (kw in projectivySettingsKeywords) {
                              if (txt.contains(kw) || desc.contains(kw)) {
                                  return true
                              }
                          }

                          if (node.isFocused || node.isSelected) {
                              if (txt == "settings" || txt == "cài đặt" ||
                                  desc == "settings" || desc == "cài đặt" ||
                                  desc.contains("projectivy")
                              ) {
                                  node.getBoundsInScreen(rect)
                                  if (rect.top in 0..topBarThreshold) {
                                      return true
                                  }
                              }
                          }
                      }

                      val childCount = node.childCount
                      for (i in 0 until childCount) {
                          val child = try { node.getChild(i) } catch (_: Throwable) { null }
                          if (child != null) queue.add(child)
                      }
                  }
                  return false
              }

              private fun setOverlayVisible(visible: Boolean) {
                  val view = rootContainer ?: return
                  if (visible) {
                      if (view.visibility != View.VISIBLE) {
                          view.visibility = View.VISIBLE
                          tvTopClock.text = "🕒 ${VietCalendarEngine.currentClockText()}"
                          refreshCalendarDataUI()
                      }
                  } else {
                      if (view.visibility != View.GONE) {
                          view.visibility = View.GONE
                      }
                  }
              }

              private fun verifyActiveWindowAndVisibility() {
                  if (isEditMode) return
                  if (rootContainer == null) return

                  var activeRoot: AccessibilityNodeInfo? = null
                  var detectedPkg: String? = null
                  var hasNonLauncherAppWindow = false
                  var appWindowCount = 0

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      try {
                          val winList = windows
                          if (!winList.isNullOrEmpty()) {
                              for (w in winList) {
                                  if (w.type == AccessibilityWindowInfo.TYPE_APPLICATION) {
                                      val wRoot = try { w.root } catch (_: Throwable) { null }
                                      val p = wRoot?.packageName?.toString()
                                      if (!p.isNullOrEmpty() && !isIgnoredSelfOrKeyboardPkg(p)) {
                                          appWindowCount++
                                          if (!isLauncherPkg(p)) hasNonLauncherAppWindow = true
                                          if (w.isActive || w.isFocused || detectedPkg == null) {
                                              detectedPkg = p
                                              if (wRoot != null) activeRoot = wRoot
                                          }
                                      } else if (w.isActive || w.isFocused) {
                                          appWindowCount++
                                      }
                                  } else if (w.type == AccessibilityWindowInfo.TYPE_SYSTEM) {
                                      if (w.isActive || w.isFocused) {
                                          val sp = try { w.root?.packageName?.toString() } catch (_: Throwable) { null }
                                          if (!sp.isNullOrEmpty() && !isIgnoredSelfOrKeyboardPkg(sp)) {
                                              hasNonLauncherAppWindow = true
                                          }
                                      }
                                  }
                              }
                          }
                      } catch (_: Throwable) {}
                  }

                  try {
                      val rw = rootInActiveWindow
                      val activePkg = rw?.packageName?.toString()
                      if (!activePkg.isNullOrEmpty() && !isIgnoredSelfOrKeyboardPkg(activePkg)) {
                          detectedPkg = activePkg
                          activeRoot = rw
                          if (!isLauncherPkg(activePkg)) hasNonLauncherAppWindow = true
                      }
                  } catch (_: Throwable) {}

                  if (hasNonLauncherAppWindow || appWindowCount > 1) {
                      setOverlayVisible(false)
                      return
                  }

                  val effectivePkg = detectedPkg ?: currentForegroundPkg
                  if (effectivePkg.isEmpty() || !isLauncherPkg(effectivePkg)) {
                      setOverlayVisible(false)
                      return
                  }

                  currentForegroundPkg = effectivePkg

                  if (isLauncherSubMenuOrSettingsOpen(activeRoot)) {
                      setOverlayVisible(false)
                  } else {
                      setOverlayVisible(true)
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val evType = event?.eventType ?: return
                  val pkg = event.packageName?.toString() ?: ""

                  when (evType) {
                      AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED -> {
                          if (pkg.isNotEmpty() && !isIgnoredSelfOrKeyboardPkg(pkg)) {
                              currentForegroundPkg = pkg
                              val cls = event.className?.toString() ?: ""
                              if (isLauncherPkg(pkg) && cls.isNotEmpty()) {
                                  val lowerCls = cls.lowercase(Locale.ROOT)
                                  if (!lowerCls.startsWith("android.widget.") &&
                                      !lowerCls.startsWith("android.view.") &&
                                      !lowerCls.startsWith("androidx.recyclerview.")
                                  ) {
                                      currentLauncherSimpleClass = lowerCls.substringAfterLast('.')
                                  }
                              } else if (!isLauncherPkg(pkg)) {
                                  isTopBarSettingsIconFocused = false
                              }
                          }
                          if (!isEditMode) scheduleVisibilityCheck(80L)
                      }
                      AccessibilityEvent.TYPE_VIEW_FOCUSED -> {
                          if (!isEditMode && isLauncherPkg(pkg)) {
                              val src = try { event.source } catch (_: Throwable) { null }
                              if (src != null) {
                                  val txt = src.text?.toString()?.trim()?.lowercase(Locale.ROOT) ?: ""
                                  val desc = src.contentDescription?.toString()?.trim()?.lowercase(Locale.ROOT) ?: ""
                                  val rect = Rect()
                                  src.getBoundsInScreen(rect)
                                  val topLimit = (resources.displayMetrics.heightPixels * 0.18f).toInt()
                                  isTopBarSettingsIconFocused = (rect.top in 0..topLimit) && (
                                          txt == "settings" || txt == "cài đặt" ||
                                          desc == "settings" || desc == "cài đặt" ||
                                          desc.contains("projectivy")
                                  )
                              } else {
                                  isTopBarSettingsIconFocused = false
                              }
                              scheduleVisibilityCheck(150L)
                          }
                      }
                      AccessibilityEvent.TYPE_WINDOWS_CHANGED -> {
                          if (!isEditMode) scheduleVisibilityCheck(150L)
                      }
                  }
              }

              private fun dp(value: Float): Int {
                  return TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP,
                      value,
                      resources.displayMetrics
                  ).toInt()
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun ensureOverlayCreated() {
                  if (rootContainer != null) return
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager

                  val prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  scalePercent = prefs.getInt(KEY_SCALE_PCT, 75).coerceIn(40, 150)
                  transparencyPercent = prefs.getInt(KEY_TRANSPARENCY, 20).coerceIn(0, 100)
                  textColorIdx = prefs.getInt(KEY_TEXT_COLOR, 0).coerceIn(0, textThemeNames.size - 1)
                  lunarCircleColorIdx = prefs.getInt(KEY_LUNAR_CIRCLE_COLOR, 0).coerceIn(0, lunarCircleThemeNames.size - 1)
                  bgThemeIdx = prefs.getInt(KEY_BG_THEME, 0).coerceIn(0, bgThemeNames.size - 1)
                  layoutModeIdx = prefs.getInt(KEY_LAYOUT_MODE, 0).coerceIn(0, layoutModeNames.size - 1)
                  priceDisplayMode = prefs.getInt(KEY_PRICE_MODE, 0).coerceIn(0, priceModeNames.size - 1)

                  // Khôi phục dữ liệu SDUI từ cache để bật TV có số hiển thị ngay lập tức
                  val cachedStr = prefs.getString(KEY_CACHED_BOARD, null)
                  if (!cachedStr.isNullOrEmpty()) {
                      try {
                          boardData = DynamicBoardData.fromJson(JSONObject(cachedStr))
                      } catch (_: Throwable) {}
                  }

                  val metrics = resources.displayMetrics
                  val defaultX = (metrics.widthPixels * 0.44f).toInt()
                  val defaultY = (metrics.heightPixels * 0.08f).toInt()

                  val windowType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP_MR1) {
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      windowType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = prefs.getInt(KEY_X, defaultX)
                      y = prefs.getInt(KEY_Y, defaultY)
                  }

                  val frame = object : FrameLayout(this) {
                      override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                          if (!isEditMode) return super.dispatchKeyEvent(event)

                          if (event.action == KeyEvent.ACTION_DOWN) {
                              if (isMoveSubMode) {
                                  val step = when {
                                      event.repeatCount > 6 -> 72
                                      event.repeatCount > 2 -> 36
                                      else -> 14
                                  }
                                  when (event.keyCode) {
                                      KeyEvent.KEYCODE_DPAD_LEFT -> { moveBy(-step, 0); return true }
                                      KeyEvent.KEYCODE_DPAD_RIGHT -> { moveBy(step, 0); return true }
                                      KeyEvent.KEYCODE_DPAD_UP -> { moveBy(0, -step); return true }
                                      KeyEvent.KEYCODE_DPAD_DOWN -> { moveBy(0, step); return true }
                                      KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> {
                                          isMoveSubMode = false
                                          updateSettingsDockUI()
                                          applyVisualStyle()
                                          return true
                                      }
                                      KeyEvent.KEYCODE_BACK, KeyEvent.KEYCODE_MENU -> {
                                          enableEditMode(false)
                                          return true
                                      }
                                  }
                              } else {
                                  when (event.keyCode) {
                                      KeyEvent.KEYCODE_DPAD_UP -> {
                                          selectedMenuRow = (selectedMenuRow - 1 + settingRowContainers.size) % settingRowContainers.size
                                          updateSettingsDockUI()
                                          return true
                                      }
                                      KeyEvent.KEYCODE_DPAD_DOWN -> {
                                          selectedMenuRow = (selectedMenuRow + 1) % settingRowContainers.size
                                          updateSettingsDockUI()
                                          return true
                                      }
                                      KeyEvent.KEYCODE_DPAD_LEFT -> {
                                          adjustSettingValue(-1)
                                          return true
                                      }
                                      KeyEvent.KEYCODE_DPAD_RIGHT -> {
                                          adjustSettingValue(1)
                                          return true
                                      }
                                      KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> {
                                          when (selectedMenuRow) {
                                              6 -> {
                                                  fetchCloudBoardAsync(force = true, showToast = true)
                                              }
                                              7 -> {
                                                  dayOffset = 0
                                                  lastRenderedHourKey = ""
                                                  refreshCalendarDataUI()
                                                  updateSettingsDockUI()
                                              }
                                              8 -> {
                                                  isMoveSubMode = true
                                                  updateSettingsDockUI()
                                                  applyVisualStyle()
                                              }
                                              else -> {
                                                  enableEditMode(false)
                                              }
                                          }
                                          return true
                                      }
                                      KeyEvent.KEYCODE_BACK, KeyEvent.KEYCODE_MENU -> {
                                          enableEditMode(false)
                                          return true
                                      }
                                  }
                              }
                          }
                          return super.dispatchKeyEvent(event)
                      }
                  }
                  frame.setBackgroundColor(Color.TRANSPARENT)
                  frame.clipChildren = false
                  frame.clipToPadding = false
                  frame.visibility = View.GONE

                  val content = buildMasterLayout()
                  frame.addView(content)
                  masterLayout = content

                  var initX = 0
                  var initY = 0
                  var touchX = 0f
                  var touchY = 0f
                  calendarCard?.setOnTouchListener { _, ev ->
                      when (ev.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initX = params.x
                              initY = params.y
                              touchX = ev.rawX
                              touchY = ev.rawY
                              false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = initX + (ev.rawX - touchX).toInt()
                              params.y = initY + (ev.rawY - touchY).toInt()
                              try { windowManager.updateViewLayout(frame, params) } catch (_: Throwable) {}
                              savePosition()
                              true
                          }
                          else -> false
                      }
                  }

                  try {
                      windowManager.addView(frame, params)
                      rootContainer = frame
                  } catch (_: Throwable) {}

                  tvTopClock.text = "🕒 ${VietCalendarEngine.currentClockText()}"
                  refreshCalendarDataUI()
                  renderDynamicBoardUI()
                  applyTextAndCircleColors()
                  applyLayoutMode()
                  applyVisualStyle()
                  applyScale()
                  updateSettingsDockUI()
                  verifyActiveWindowAndVisibility()
              }

