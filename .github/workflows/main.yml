name: Build APK Lịch Song Tròn & Giá Nông Sản (v13.0 Server-Driven UI)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt JDK 21 (LTS)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Cài đặt Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 4. Khởi tạo mã nguồn Lịch Song Tròn + Server-Driven UI v13.0
        run: |
          rm -rf app gradle.properties settings.gradle build.gradle GenerateAssets.java
          mkdir -p app/src/main/java/com/daklak/eakiet/lichvannien
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # 4.1. Cấu hình Gradle (Không dùng thư viện ngoài, loại bỏ hoàn toàn Jsoup)
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LichVanNienTV"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.daklak.eakiet.lichvannien'
              compileSdk 35

              defaultConfig {
                  applicationId "com.daklak.eakiet.lichvannien"
                  minSdk 21
                  targetSdk 28
                  versionCode 17
                  versionName "13.0-DualCircle-SDUI"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
          }
          EOF

          # 4.2. Tạo Logo PNG Song Tròn Nhật-Nguyệt & Banner 16:9 bằng Java 2D
          cat << 'EOF' > GenerateAssets.java
          import java.awt.*;
          import java.awt.geom.*;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;

          public class GenerateAssets {
              public static void main(String[] args) throws Exception {
                  drawIcon(144, false, "app/src/main/res/mipmap-hdpi/ic_launcher.png");
                  drawIcon(192, false, "app/src/main/res/mipmap-xhdpi/ic_launcher.png");
                  drawIcon(192, true,  "app/src/main/res/mipmap-xhdpi/ic_launcher_round.png");
                  drawIcon(288, false, "app/src/main/res/mipmap-xxhdpi/ic_launcher.png");
                  drawIcon(288, true,  "app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png");
                  drawBanner(320, 180, "app/src/main/res/drawable-xhdpi/ic_banner.png");
              }

              private static void setupHints(Graphics2D g) {
                  g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
                  g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING, RenderingHints.VALUE_TEXT_ANTIALIAS_ON);
                  g.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY);
              }

              private static void drawIcon(int size, boolean round, String path) throws Exception {
                  BufferedImage img = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB);
                  Graphics2D g = img.createGraphics();
                  setupHints(g);

                  Shape clip = round
                      ? new Ellipse2D.Float(0, 0, size, size)
                      : new RoundRectangle2D.Float(0, 0, size, size, size * 0.22f, size * 0.22f);
                  g.setClip(clip);

                  GradientPaint bg = new GradientPaint(
                      0, 0, new Color(11, 12, 16),
                      size, size, new Color(22, 24, 35)
                  );
                  g.setPaint(bg);
                  g.fillRect(0, 0, size, size);

                  int r = (int)(size * 0.26f);
                  int cy = (int)(size * 0.50f);
                  int cxLeft = (int)(size * 0.34f);
                  int cxRight = (int)(size * 0.66f);

                  GradientPaint sun = new GradientPaint(
                      cxLeft - r, cy, new Color(255, 230, 0),
                      cxLeft + r, cy, new Color(217, 119, 6)
                  );
                  g.setPaint(sun);
                  g.fillOval(cxLeft - r, cy - r, r * 2, r * 2);

                  GradientPaint moon = new GradientPaint(
                      cxRight - r, cy, new Color(224, 242, 254),
                      cxRight + r, cy, new Color(2, 132, 199)
                  );
                  g.setPaint(moon);
                  g.fillOval(cxRight - r, cy - r, r * 2, r * 2);

                  g.setColor(new Color(255, 255, 255, 210));
                  g.setStroke(new BasicStroke(size * 0.02f));
                  g.drawOval(cxLeft - (int)(r * 0.85f), cy - (int)(r * 0.85f), (int)(r * 1.7f), (int)(r * 1.7f));
                  g.drawOval(cxRight - (int)(r * 0.85f), cy - (int)(r * 0.85f), (int)(r * 1.7f), (int)(r * 1.7f));

                  g.setFont(new Font("SansSerif", Font.BOLD, (int)(size * 0.19f)));
                  FontMetrics fm = g.getFontMetrics();
                  g.setColor(new Color(59, 40, 16));
                  g.drawString("28", cxLeft - fm.stringWidth("28") / 2, cy + (int)(size * 0.07f));
                  g.setColor(new Color(8, 47, 73));
                  g.drawString("19", cxRight - fm.stringWidth("19") / 2, cy + (int)(size * 0.07f));

                  g.dispose();
                  ImageIO.write(img, "PNG", new File(path));
              }

              private static void drawBanner(int w, int h, String path) throws Exception {
                  BufferedImage img = new BufferedImage(w, h, BufferedImage.TYPE_INT_ARGB);
                  Graphics2D g = img.createGraphics();
                  setupHints(g);

                  GradientPaint bg = new GradientPaint(
                      0, 0, new Color(11, 12, 16),
                      w, h, new Color(34, 24, 18)
                  );
                  g.setPaint(bg);
                  g.fillRoundRect(0, 0, w, h, 24, 24);

                  GradientPaint sun = new GradientPaint(18, 0, new Color(255, 230, 0), 94, 0, new Color(217, 119, 6));
                  g.setPaint(sun);
                  g.fillOval(18, 52, 76, 76);

                  GradientPaint moon = new GradientPaint(102, 0, new Color(224, 242, 254), 178, 0, new Color(2, 132, 199));
                  g.setPaint(moon);
                  g.fillOval(102, 52, 76, 76);

                  g.setColor(new Color(255, 255, 255, 200));
                  g.setStroke(new BasicStroke(2f));
                  g.drawOval(24, 58, 64, 64);
                  g.drawOval(108, 58, 64, 64);

                  g.setFont(new Font("SansSerif", Font.BOLD, 10));
                  g.setColor(new Color(253, 224, 71));
                  g.drawString("DƯƠNG LỊCH", 26, 44);
                  g.setColor(new Color(125, 211, 252));
                  g.drawString("ÂM LỊCH", 118, 44);

                  g.setFont(new Font("SansSerif", Font.BOLD, 20));
                  g.setColor(new Color(59, 40, 16));
                  g.drawString("28|11", 31, 98);
                  g.setColor(new Color(8, 47, 73));
                  g.drawString("19|10", 115, 98);

                  g.setColor(new Color(241, 184, 31));
                  g.setFont(new Font("SansSerif", Font.BOLD, 12));
                  g.drawString("★ EA KIẾT • ĐẮK LẮK", 190, 62);

                  g.setColor(Color.WHITE);
                  g.setFont(new Font("SansSerif", Font.BOLD, 17));
                  g.drawString("LỊCH & GIÁ TV", 190, 92);

                  g.setColor(new Color(110, 231, 183));
                  g.setFont(new Font("SansSerif", Font.BOLD, 11));
                  g.drawString("CÀ PHÊ • TIÊU • SẦU RIÊNG", 190, 116);
                  g.setColor(new Color(203, 213, 225));
                  g.drawString("VÀNG SJC • XĂNG DẦU", 190, 134);

                  g.dispose();
                  ImageIO.write(img, "PNG", new File(path));
              }
          }
          EOF
          java -Djava.awt.headless=true GenerateAssets.java
          rm -f GenerateAssets.java

