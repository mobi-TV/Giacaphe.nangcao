          # 4.5. Tạo GradientTextView.kt (Có cache LinearGradient giúp mượt 60fps, không tốn RAM/GC)
          cat << 'EOF' > app/src/main/java/com/daklak/eakiet/lichvannien/GradientTextView.kt
          package com.daklak.eakiet.lichvannien

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.LinearGradient
          import android.graphics.Shader
          import android.widget.TextView
          import kotlin.math.max
          import kotlin.math.min

          class GradientTextView(context: Context) : TextView(context) {

              private var gradColors: IntArray? = null
              private var gradPositions: FloatArray? = null
              private var cachedShader: LinearGradient? = null
              private var lastStartX = -1f
              private var lastSpan = -1f

              fun setLeftToRightGradient(colors: IntArray?, positions: FloatArray? = floatArrayOf(0f, 0.48f, 1f)) {
                  gradColors = colors
                  gradPositions = positions
                  cachedShader = null
                  lastStartX = -1f
                  lastSpan = -1f
                  if (colors == null) {
                      paint.shader = null
                  }
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  val colors = gradColors
                  if (colors != null && colors.size >= 2 && width > 0) {
                      val layoutObj = layout
                      var startX = paddingLeft.toFloat()
                      var endX = (width - paddingRight).toFloat()

                      if (layoutObj != null && layoutObj.lineCount > 0) {
                          var minLeft = Float.MAX_VALUE
                          var maxRight = 0f
                          for (i in 0 until layoutObj.lineCount) {
                              minLeft = min(minLeft, layoutObj.getLineLeft(i))
                              maxRight = max(maxRight, layoutObj.getLineRight(i))
                          }
                          if (maxRight > minLeft) {
                              startX = paddingLeft + minLeft
                              endX = paddingLeft + maxRight
                          }
                      }

                      val span = (endX - startX).coerceAtLeast(20f)
                      if (cachedShader == null || startX != lastStartX || span != lastSpan) {
                          cachedShader = LinearGradient(
                              startX, 0f,
                              startX + span, 0f,
                              colors,
                              gradPositions,
                              Shader.TileMode.CLAMP
                          )
                          lastStartX = startX
                          lastSpan = span
                      }
                      paint.shader = cachedShader
                  } else {
                      paint.shader = null
                  }
                  super.onDraw(canvas)
              }
          }
          EOF

          # 4.6. Tạo DualMedallionCircleView.kt (Song Tròn gọn chia đối xứng Ngày | Tháng)
          cat << 'EOF' > app/src/main/java/com/daklak/eakiet/lichvannien/DualMedallionCircleView.kt
          package com.daklak.eakiet.lichvannien

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.util.TypedValue
          import android.view.View

          data class CirclePalette(
              val bgColors: IntArray,
              val rimColor: Int,
              val textColor: Int,
              val subLabelColor: Int,
              val dividerColor: Int,
              val badgeBgColor: Int,
              val badgeBorderColor: Int
          )

          class DualMedallionCircleView(context: Context) : View(context) {

              var dayValueText: String = "28"
              var monthValueText: String = "11"
              var badgeEmoji: String = "☀️"
              var isSpecialHighlight: Boolean = false
              var isCompactSize: Boolean = true
                  set(value) {
                      if (field != value) {
                          field = value
                          cachedBgShader = null
                          requestLayout()
                          invalidate()
                      }
                  }

              var palette: CirclePalette = SOLAR_PALETTE
                  set(value) {
                      field = value
                      cachedBgShader = null
                      invalidate()
                  }

              private var cachedBgShader: LinearGradient? = null
              private var lastShaderRadius = -1f

              private val outerPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rimPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val patternRingPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val innerRingPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val dividerPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val labelPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val numPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val badgeBgPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val badgeBorderPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val emojiPaint = Paint(Paint.ANTI_ALIAS_FLAG)

              companion object {
                  val SOLAR_PALETTE = CirclePalette(
                      bgColors = intArrayOf(
                          Color.parseColor("#FFE600"),
                          Color.parseColor("#FACC15"),
                          Color.parseColor("#D97706")
                      ),
                      rimColor = Color.parseColor("#F59E0B"),
                      textColor = Color.parseColor("#3B2810"),
                      subLabelColor = Color.parseColor("#5C3A12"),
                      dividerColor = Color.argb(125, 59, 40, 16),
                      badgeBgColor = Color.parseColor("#FFFBEB"),
                      badgeBorderColor = Color.parseColor("#D97706")
                  )

                  val LUNAR_PALETTES = arrayOf(
                      CirclePalette(
                          bgColors = intArrayOf(
                              Color.parseColor("#E0F2FE"),
                              Color.parseColor("#38BDF8"),
                              Color.parseColor("#0284C7")
                          ),
                          rimColor = Color.parseColor("#38BDF8"),
                          textColor = Color.parseColor("#082F49"),
                          subLabelColor = Color.parseColor("#0C4A6E"),
                          dividerColor = Color.argb(120, 8, 47, 73),
                          badgeBgColor = Color.parseColor("#F0F9FF"),
                          badgeBorderColor = Color.parseColor("#0284C7")
                      ),
                      CirclePalette(
                          bgColors = intArrayOf(
                              Color.parseColor("#D1FAE5"),
                              Color.parseColor("#34D399"),
                              Color.parseColor("#059669")
                          ),
                          rimColor = Color.parseColor("#34D399"),
                          textColor = Color.parseColor("#064E3B"),
                          subLabelColor = Color.parseColor("#065F46"),
                          dividerColor = Color.argb(120, 6, 78, 59),
                          badgeBgColor = Color.parseColor("#ECFDF5"),
                          badgeBorderColor = Color.parseColor("#059669")
                      ),
                      CirclePalette(
                          bgColors = intArrayOf(
                              Color.parseColor("#FCA5A5"),
                              Color.parseColor("#EF4444"),
                              Color.parseColor("#991B1B")
                          ),
                          rimColor = Color.parseColor("#F87171"),
                          textColor = Color.parseColor("#FEF9C3"),
                          subLabelColor = Color.parseColor("#FEF08A"),
                          dividerColor = Color.argb(135, 254, 249, 195),
                          badgeBgColor = Color.parseColor("#450A0A"),
                          badgeBorderColor = Color.parseColor("#F59E0B")
                      )
                  )
              }

              private fun dp(v: Float): Float =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, resources.displayMetrics)

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val w = if (isCompactSize) dp(104f).toInt() else dp(116f).toInt()
                  val h = if (isCompactSize) dp(112f).toInt() else dp(124f).toInt()
                  setMeasuredDimension(w, h)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val s = if (isCompactSize) 0.90f else 1.00f
                  val cx = width / 2f
                  val mainRadius = dp(52f * s)
                  val cy = mainRadius + dp(3f * s)

                  if (cachedBgShader == null || lastShaderRadius != mainRadius) {
                      cachedBgShader = LinearGradient(
                          cx - mainRadius, cy, cx + mainRadius, cy,
                          palette.bgColors,
                          floatArrayOf(0f, 0.52f, 1f),
                          Shader.TileMode.CLAMP
                      )
                      lastShaderRadius = mainRadius
                  }
                  outerPaint.shader = cachedBgShader
                  canvas.drawCircle(cx, cy, mainRadius, outerPaint)

                  rimPaint.style = Paint.Style.STROKE
                  rimPaint.strokeWidth = dp(if (isSpecialHighlight) 2.8f * s else 1.5f * s)
                  rimPaint.color = if (isSpecialHighlight) Color.parseColor("#FFE600") else palette.rimColor
                  canvas.drawCircle(cx, cy, mainRadius - dp(1f), rimPaint)

                  innerRingPaint.style = Paint.Style.STROKE
                  innerRingPaint.strokeWidth = dp(1.2f * s)
                  innerRingPaint.color = Color.argb(195, 255, 255, 255)
                  canvas.drawCircle(cx, cy, dp(46.5f * s), innerRingPaint)
                  canvas.drawCircle(cx, cy, dp(39.5f * s), innerRingPaint)

                  patternRingPaint.style = Paint.Style.STROKE
                  patternRingPaint.strokeWidth = dp(4.2f * s)
                  patternRingPaint.color = Color.argb(145, 255, 255, 255)
                  patternRingPaint.pathEffect = DashPathEffect(floatArrayOf(dp(4.2f * s), dp(3.0f * s)), 0f)
                  canvas.drawCircle(cx, cy, dp(43.0f * s), patternRingPaint)

                  dividerPaint.color = palette.dividerColor
                  dividerPaint.strokeWidth = dp(1.2f * s)
                  canvas.drawLine(cx, cy - dp(19f * s), cx, cy + dp(17f * s), dividerPaint)

                  val leftCenterX = cx - dp(17.5f * s)
                  val rightCenterX = cx + dp(17.5f * s)

                  labelPaint.color = palette.subLabelColor
                  labelPaint.textSize = dp(9.0f * s)
                  labelPaint.typeface = Typeface.DEFAULT_BOLD
                  labelPaint.textAlign = Paint.Align.CENTER
                  canvas.drawText("Ngày", leftCenterX, cy - dp(9.5f * s), labelPaint)
                  canvas.drawText("Tháng", rightCenterX, cy - dp(9.5f * s), labelPaint)

                  numPaint.color = palette.textColor
                  numPaint.textSize = dp(22.5f * s)
                  numPaint.typeface = Typeface.DEFAULT_BOLD
                  numPaint.textAlign = Paint.Align.CENTER
                  canvas.drawText(dayValueText, leftCenterX, cy + dp(14.5f * s), numPaint)
                  canvas.drawText(monthValueText, rightCenterX, cy + dp(14.5f * s), numPaint)

                  val badgeCy = cy + mainRadius - dp(3f * s)
                  val badgeR = dp(13.5f * s)

                  badgeBgPaint.color = palette.badgeBgColor
                  canvas.drawCircle(cx, badgeCy, badgeR, badgeBgPaint)

                  badgeBorderPaint.style = Paint.Style.STROKE
                  badgeBorderPaint.strokeWidth = dp(1.6f * s)
                  badgeBorderPaint.color = if (isSpecialHighlight) Color.parseColor("#FFE600") else palette.badgeBorderColor
                  canvas.drawCircle(cx, badgeCy, badgeR, badgeBorderPaint)

                  emojiPaint.textSize = dp(14.5f * s)
                  emojiPaint.textAlign = Paint.Align.CENTER
                  canvas.drawText(badgeEmoji, cx, badgeCy + dp(5f * s), emojiPaint)
              }
          }
          EOF

          # 4.7. Tạo VietCalendarEngine.kt
          cat << 'EOF' > app/src/main/java/com/daklak/eakiet/lichvannien/VietCalendarEngine.kt
          package com.daklak.eakiet.lichvannien

          import java.util.Calendar
          import java.util.Locale
          import java.util.TimeZone
          import kotlin.math.floor
          import kotlin.math.sin

          data class CalendarDayInfo(
              val solarDay: Int,
              val solarMonth: Int,
              val solarYear: Int,
              val weekOfYear: Int,
              val dayOfWeekStr: String,
              val lunarDay: Int,
              val lunarMonth: Int,
              val lunarYear: Int,
              val currentHourCanChi: String,
              val isCurrentHourHoangDao: Boolean,
              val dayCanChi: String,
              val monthCanChi: String,
              val yearCanChi: String,
              val zodiacEmoji: String,
              val isHoangDaoDay: Boolean,
              val gioHoangDaoShort: String,
              val menhNgayNapAm: String,
              val quoteText: String,
              val quoteAuthor: String,
